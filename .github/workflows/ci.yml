name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app tests

      - name: Test with pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=0

      - name: Coverage gate (soft — warns, does not fail the build)
        run: |
          pip install coverage
          coverage report --fail-under=80 || echo "::warning::Coverage is below the 80% target (SDD §17/§18 — soft gate, not blocking submission)"